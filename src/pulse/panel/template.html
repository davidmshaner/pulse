<!-- panel/template.html — self-contained Pulse card. Brand: davidmshaner.com. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'JetBrains Mono'; font-weight:400;
    src:url('fonts/jetbrains-mono-400.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:500;
    src:url('fonts/jetbrains-mono-500.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:600;
    src:url('fonts/jetbrains-mono-600.woff2') format('woff2'); }
  :root{ --cream:#F7F5F2; --ink:#2D2A26; --sage:#5B7B6A; --muted:#8A857D;
         --amber:#C08A3E; --clay:#B0533F; --line:#E7E3DD; --panel:#EFEBE5; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--cream);color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  body{padding:18px 18px 14px;width:360px;}
  .head{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--sage);padding-bottom:10px;margin-bottom:12px;}
  .head .verdict{font-size:13px;font-weight:600;letter-spacing:-0.2px;}
  .head .toggle{font-size:11px;font-weight:500;color:var(--sage);cursor:pointer;letter-spacing:0.3px;}
  .head .toggle:hover{color:var(--ink);}
  .head .pick{font-size:12px;font-weight:500;letter-spacing:0.3px;}
  .head .pick .seg{color:var(--muted);cursor:pointer;}
  .head .pick .seg:hover{color:var(--ink);}
  .head .pick .seg.active{color:var(--sage);font-weight:600;}
  .head .pick .pdiv{color:var(--line);padding:0 6px;}
  .row .sub .trk{color:var(--muted);}
  .row{margin:10px 0;}
  .row .top{display:flex;justify-content:space-between;font-size:12px;font-weight:500;}
  .row .name{letter-spacing:0.3px;}
  .row .figs{color:var(--muted);font-size:11px;}
  .bar{height:5px;background:var(--line);border-radius:3px;margin:5px 0 4px;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:3px;}
  .s-under > i{background:var(--sage);} .s-near > i{background:var(--amber);}
  .s-over  > i{background:var(--clay);}
  .row .sub{display:flex;gap:14px;font-size:10px;color:var(--muted);letter-spacing:0.3px;}
  .row .sub .mtg{color:var(--sage);}
  .now{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink);display:flex;justify-content:space-between;}
  .now .dot{color:var(--sage);}
  .foot{margin-top:8px;font-size:10px;color:var(--muted);}
  .foot .mtgcount{color:var(--ink);font-weight:500;}
  .foot .reslink{color:var(--sage);cursor:pointer;font-weight:500;}
  .foot .reslink:hover{color:var(--ink);}
  .total{background:var(--panel);border-radius:6px;padding:10px 12px;margin-bottom:6px;}
  .pgroup{margin:11px 0;}
  .pproj{font-size:12px;font-weight:600;letter-spacing:0.3px;}
  .pnames{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55;}
  .phint,.rlead{margin-top:0;font-size:10px;color:var(--muted);line-height:1.5;}
  .phint{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
  .rlead{margin-bottom:8px;}
  .rprompt{font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:9px 11px;line-height:1.45;user-select:all;word-break:break-word;color:var(--ink);}
  .rcopy{display:inline-block;margin-top:8px;font-size:10px;color:var(--sage);cursor:pointer;
    border:1px solid var(--sage);border-radius:4px;padding:3px 10px;letter-spacing:0.3px;}
  .rcopy:hover{background:var(--sage);color:var(--cream);}
  .rgroup{margin-top:13px;}
  .rh{font-size:11px;font-weight:600;color:var(--ink);letter-spacing:0.3px;}
  .ritems{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.55;}
  /* update-available banner (#25) — sage-accented, shown only when behind main */
  .update{background:var(--panel);border:1px solid var(--sage);border-left-width:3px;
    border-radius:6px;padding:9px 11px;margin-bottom:12px;}
  .update .uh{font-size:11px;font-weight:600;color:var(--sage);letter-spacing:0.3px;}
  .update .ucmd{font-size:10px;color:var(--ink);margin-top:5px;background:var(--cream);
    border:1px solid var(--line);border-radius:4px;padding:6px 8px;user-select:all;
    word-break:break-word;line-height:1.45;}
  .update .ucopy{display:inline-block;margin-top:7px;font-size:10px;color:var(--sage);
    cursor:pointer;border:1px solid var(--sage);border-radius:4px;padding:2px 9px;letter-spacing:0.3px;}
  .update .ucopy:hover{background:var(--sage);color:var(--cream);}
</style>
</head>
<body>
<div id="app"></div>
<script>
var VM = null, VIEW = 'time', WINDOW = 'week';
try{ var _sw = localStorage.getItem('pulse_window');
     if(_sw==='day'||_sw==='week'||_sw==='month') WINDOW=_sw; }catch(e){}
function resolvePrompt(){
  var where = (VM && VM.repo_path) ? VM.repo_path : 'the pulse repo';
  return 'In ' + where + ', read setup/RESOLVE.md and resolve my uncategorized Pulse items.';
}

function bar(pct, status){
  var w = Math.min(100, pct);
  return '<div class="bar s-'+status+'"><i style="width:'+w+'%"></i></div>';
}
function fig(h){ return (h===null||h===undefined)?'–':h.toFixed(1)+'h'; }
function dollars(v){ return (v===null||v===undefined)?'–':'$'+Math.round(v).toLocaleString('en-US'); }

function nameSpan(e){
  return '<span class="name">'+e.name+'</span>';
}

function rowShell(e){
  // One opening tag for every row. Nested groups (#31/#50) inset the WHOLE card
  // by depth — border, title, bar and sub-line shift together, so hierarchy reads
  // as containment. depth 0/absent -> no style attribute, so a flat config's
  // rendered DOM is byte-identical to before nesting existed.
  var cls = 'row' + (e.is_group ? ' total' : '');
  var inset = e.depth ? ' style="margin-left:'+(e.depth*14)+'px"' : '';
  return '<div class="'+cls+'"'+inset+'>';
}

function headHTML(title, toggleView, toggleLabel){
  return '<div class="head"><span class="verdict">'+title+'</span>'
    + '<span class="toggle" onclick="setView(\''+toggleView+'\')">'+toggleLabel+'</span></div>';
}

function seg(w){
  return '<span class="seg'+(WINDOW===w?' active':'')+'" onclick="setWindow(\''+w+'\')">'+w+'</span>';
}

function dayRowHTML(e){
  // A day has no cap, so every row renders track-style (today's hours, no bar).
  return rowShell(e) + '<div class="top">'
    + nameSpan(e)
    + '<span class="figs">'+fig(e.day.actual_h)+' today</span></div>'
    + '<div class="sub"><span class="trk">tracked</span>'
    + '<span>7d '+fig(e.d7_h)+'</span></div></div>';
}

function incomeRowHTML(e){
  // Income-meter engagement (#38). Month view is the $ meter; week view keeps
  // hours track-style (no weekly $ cap in v1). Day view is handled upstream.
  if(WINDOW==='week'){
    return rowShell(e) + '<div class="top">'
      + nameSpan(e)
      + '<span class="figs">'+fig(e.week.actual_h)+' wk</span></div>'
      + '<div class="sub"><span class="trk">tracked</span>'
      + '<span>today '+fig(e.today_h)+'</span>'
      + '<span>7d '+fig(e.d7_h)+'</span></div></div>';
  }
  var m = e.month;
  if(m.cap_value===null||m.cap_value===undefined){
    // pure running meter — $ billed so far this month, no ceiling, no bar
    return rowShell(e) + '<div class="top">'
      + nameSpan(e)
      + '<span class="figs">'+dollars(m.billed)+' mo</span></div>'
      + '<div class="sub"><span class="trk">'+dollars(e.bill_rate)+'/hr meter</span>'
      + '<span>today '+fig(e.today_h)+'</span>'
      + '<span>7d '+fig(e.d7_h)+'</span></div></div>';
  }
  var verdict = m.over ? dollars(m.dollars_over)+' over' : dollars(m.dollars_left)+' left';
  return rowShell(e)
    + '<div class="top">' + nameSpan(e)
    + '<span class="figs">'+dollars(m.billed)+' / '+dollars(m.cap_value)+' mo</span></div>'
    + bar(m.pct, m.status)
    + '<div class="sub"><span>'+verdict+'</span>'
    + '<span>today '+fig(e.today_h)+'</span>'
    + '<span>7d '+fig(e.d7_h)+'</span></div></div>';
}

function rowHTML(e){
  if(WINDOW==='day') return dayRowHTML(e);
  if(e.income_mode) return incomeRowHTML(e);
  var w = (WINDOW==='month') ? e.month : e.week;
  var unit = (WINDOW==='month') ? 'mo' : 'wk';
  if(e.track_only){
    return rowShell(e) + '<div class="top">'
      + nameSpan(e)
      + '<span class="figs">'+fig(w.actual_h)+' '+unit+'</span></div>'
      + '<div class="sub"><span class="trk">tracked</span>'
      + '<span>today '+fig(e.today_h)+'</span>'
      + '<span>7d '+fig(e.d7_h)+'</span></div></div>';
  }
  var verdict = w.status==='over' ? (w.pct-100)+'% over'
              : (w.cap_h - w.actual_h).toFixed(1)+'h left';
  var mtg = (e.meeting_h && e.meeting_h > 0)
          ? '<span class="mtg">mtg '+fig(e.meeting_h)+'</span>' : '';
  return rowShell(e)
    + '<div class="top">' + nameSpan(e)
    + '<span class="figs">'+fig(w.actual_h)+' / '+fig(w.cap_h)+' '+unit+'</span></div>'
    + bar(w.pct, w.status)
    + '<div class="sub"><span>'+verdict+'</span>'
    + '<span>today '+fig(e.today_h)+'</span>'
    + '<span>7d '+fig(e.d7_h)+'</span>'
    + mtg + '</div></div>';
}

function updateBannerHTML(){
  // Shown only when the clone is behind shanerconsulting/pulse main (VM.update set by
  // render_state from state.json's update_check block). Silent otherwise — no nagging.
  if(!VM || !VM.update) return '';
  return '<div class="update"><div class="uh">↑ Update available</div>'
    + '<div class="ucmd">'+VM.update.command+'</div>'
    + '<div class="ucopy" onclick="copyUpdate()">copy</div></div>';
}

function copyUpdate(){
  var cmd = (VM && VM.update) ? VM.update.command : '';
  var el = document.querySelector('.ucopy');
  var done = function(m){ if(el){ el.textContent=m;
    setTimeout(function(){ if(el) el.textContent='copy'; }, 1600); } };
  try{
    navigator.clipboard.writeText(cmd)
      .then(function(){ done('copied ✓'); }, function(){ done('select text above'); });
  }catch(e){ done('select text above'); }
}

function renderTime(){
  var html = updateBannerHTML() + '<div class="head"><span class="pick">'
    + seg('day') + '<span class="pdiv">/</span>' + seg('week')
    + '<span class="pdiv">/</span>' + seg('month')
    + '</span><span class="toggle" onclick="setView(\'people\')">people ›</span></div>';
  // One interleaved list (#66): groups and their member engagements arrive in
  // render order from the view model — no separate engagement pass.
  (VM.rows||[]).forEach(function(r){ html += rowHTML(r); });
  if(VM.now){ html += '<div class="now"><span><span class="dot">●</span> now: '
    + VM.now.label+'</span><span>~'+VM.now.elapsed_min+' min</span></div>'; }
  var foot = '';
  var warns = (VM.rows||[]).filter(function(r){return r.is_group && r.overlap && r.overlap.length;});
  if(warns.length){ foot += '<div class="foot" style="color:var(--clay)">'
    + '⚠ group overlap — a member bucket contains another; check appetite.yaml</div>'; }
  if(VM.meetings_wtd){ foot += '<div class="foot"><span class="mtgcount">'
    + VM.meetings_wtd+' meetings</span> counted this week</div>'; }
  var u = VM.uncategorized;
  if(u && (u.sessions + u.meetings) > 0){
    foot += '<div class="foot">uncategorized: '+u.sessions+' sessions, '+u.meetings
      + ' meetings &nbsp;<span class="reslink" onclick="setView(\'resolve\')">resolve ›</span></div>';
  }
  if(VM.overhead_sessions){
    foot += '<div class="foot">'+VM.overhead_sessions+' overhead (no files touched)</div>';
  }
  document.getElementById('app').innerHTML = html + foot;
}

function renderPeople(){
  var html = headHTML('People → project', 'time', '‹ back');
  var people = VM.people || [];
  if(!people.length){
    html += '<div class="phint">No people learned yet. Pulse fills this in as it '
      + 'sees who you meet with and which project the work lands in.</div>';
    document.getElementById('app').innerHTML = html; return;
  }
  var byProj = {};
  people.forEach(function(p){ (byProj[p.project]=byProj[p.project]||[]).push(p.name); });
  Object.keys(byProj).forEach(function(proj){
    html += '<div class="pgroup"><div class="pproj">'+proj+'</div>'
      + '<div class="pnames">'+byProj[proj].join(', ')+'</div></div>';
  });
  html += '<div class="phint">A meeting with any of these bills to its project automatically.</div>';
  document.getElementById('app').innerHTML = html;
}

function renderResolve(){
  var html = headHTML('Resolve uncategorized', 'time', '‹ back');
  html += '<div class="rlead">Pulse couldn\'t confidently place these. Paste this into '
    + 'Claude Code (any folder) and it will categorize them, teach the registry, '
    + 'and re-run:</div>';
  html += '<div class="rprompt">'+resolvePrompt()+'</div>';
  html += '<div class="rcopy" onclick="copyPrompt()">copy</div>';
  var d = VM.uncategorized_detail || {sessions:[], meetings:[]};
  if(d.sessions && d.sessions.length){
    html += '<div class="rgroup"><div class="rh">sessions</div>'
      + '<div class="ritems">'+d.sessions.join(', ')+'</div></div>';
  }
  if(d.meetings && d.meetings.length){
    html += '<div class="rgroup"><div class="rh">meetings</div>'
      + '<div class="ritems">'+d.meetings.join(' · ')+'</div></div>';
  }
  document.getElementById('app').innerHTML = html;
}

function copyPrompt(){
  var done = function(msg){ var el=document.querySelector('.rcopy');
    if(el){ el.textContent=msg; setTimeout(function(){ if(el) el.textContent='copy'; }, 1600); } };
  try{
    navigator.clipboard.writeText(resolvePrompt())
      .then(function(){ done('copied ✓'); }, function(){ done('select text above'); });
  }catch(e){ done('select text above'); }
}

function paint(){
  if(!VM){ document.getElementById('app').textContent='No data yet.'; return; }
  if(VIEW==='people'){ renderPeople(); }
  else if(VIEW==='resolve'){ renderResolve(); }
  else { renderTime(); }
}
function setView(v){ VIEW = v; paint(); }
function setWindow(w){ WINDOW = w; try{ localStorage.setItem('pulse_window', w); }catch(e){} paint(); }
function renderPulse(vm){ VM = vm; paint(); }

window.__PULSE_VM__ = /*__PULSE_VM__*/ null;
renderPulse(window.__PULSE_VM__);
</script>
</body>
</html>
