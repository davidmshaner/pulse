# Pulse machine config. The setup skill generates this per machine. Relative
# paths resolve against your home directory; absolute paths are used as-is.
# Repo-internal inputs (timecore, registry, learnings, rules) auto-default to
# this repo's own files, so a fresh clone runs standalone with no edits here.

timezone: America/New_York

# Claude Code session sources (JSONL).
projects_dirs:
  - .claude/projects

# Claude Cowork (local agent mode) sessions. Omit for the OS-aware default
# (macOS: ~/Library/Application Support/Claude/local-agent-mode-sessions).
# cowork_root: Library/Application Support/Claude/local-agent-mode-sessions

# --- Advanced overrides (optional) ---------------------------------------
# By default these resolve to the vendored copies / repo-local files in THIS
# clone, regardless of where you cloned it. Set them only to point elsewhere.
# timecore_dir: <path to a timecore checkout>      # default: src/pulse/timecore (vendored)
# registry:     <path to your bucket-registry.yaml> # default: ./bucket-registry.yaml
# learnings:    <path to your learnings.yaml>       # default: ./learnings.yaml
# rules:        <path to your disambiguation-rules.yaml> # default: ./disambiguation-rules.yaml

# Calendar (optional). When accounts are listed, meeting time is counted toward
# your engagements via Google Calendar OAuth (reusing the credential files written
# by google_workspace_mcp). Empty accounts = sessions + Cowork only.
calendar:
  self_emails: []          # your own email addresses (filtered out of co-attendees)
  accounts: []             # e.g.:
  #   - {tag: work,     credentials_dir: .google_workspace_mcp/credentials_work}
  #   - {tag: personal, credentials_dir: .google_workspace_mcp/credentials_personal}

# Cowork session classification (optional). Maps Claude Cowork sessions to your
# categories by slash-command, sender email, or title regex. Omit = Cowork
# sessions that can't be classified are skipped. Example:
# cowork_classification:
#   slash_bucket:
#     my-client-slug: [ClientA]
#   email_default:
#     you@example.com: [ClientA]
#   title_patterns:
#     - {pattern: "weekly sync", bucket: [ClientA]}
#   cron_templates:
#     - "^<scheduled-task"       # generic Claude scheduled-task marker
