# Per-engagement time budget + roll-up groups. Hand-maintained.
#
# An engagement is one of four flavors:
#   rate-mode    monthly_value + target_rate  -> derived hour cap
#                (weekly_cap = monthly_value / target_rate / 4.33)
#   hours-mode   weekly_hours and/or monthly_hours -> direct hour cap
#   income-mode  bill_rate ($/hr) -> meters $ billed for the calendar month
#                ($ = month-to-date hours × bill_rate). Optional monthly_cap_value
#                ($/mo) adds a dollar ceiling ("$X left" / "OVER $X"); omit it for a
#                pure running meter (no bar). The inverse of rate-mode: it keeps the
#                dollars instead of dividing them into an hour cap. Don't combine
#                bill_rate with the hour-cap keys — that's a loud preflight error.
#   track-only   none of the above -> shown and rolled up, but no cap and no bar.
#                Use `bucket:` to map a pretty name to its registry leaf.
#
# Groups bundle engagements under one aggregate cap. `members: "*"` means every
# defined engagement. A member may ALSO name another group (recursive members), so
# groups nest into a hierarchy that ladders up to higher-level totals — the tree
# reads top-down in this file. A group with no cap (`weekly_hours`/`monthly_hours`
# omitted) is a pure roll-up: it shows summed hours with no bar. An engagement
# reachable via more than one path is counted once; an unknown member, a membership
# cycle, or a nesting that would double-count is a loud config error, not a silent
# miscount. (Legacy configs with a top-level `total_budget:` instead of `groups:`
# still work — it's read as a single "Billable" group over all members.)

engagements:
  ClientA:
    weekly_hours: 8            # hours-mode — the simplest cap

  ClientB:
    weekly_hours: 6

  RetainerClient:
    monthly_value: 5000        # rate-mode — $/mo + your target $/hr derives the cap
    target_rate:   250

  HourlyClient:
    bill_rate: 200             # income-mode with a cap — meters $ billed this month
    monthly_cap_value: 10000   # ...toward a $10k/mo ceiling ("$X left" / "OVER $X")

  MeterClient:
    bill_rate: 150             # income-mode, pure meter — running $ billed, no ceiling

  Personal:
    bucket: personal           # track-only — no cap, just visibility + roll-up

groups:
  Billable:
    members: [ClientA, ClientB, RetainerClient]   # engagements
    weekly_hours:  20
    monthly_hours: 86
  "Personal Software":         # a capless roll-up — summed hours, no bar
    members: [Personal]
  "All Work":                  # NESTED: members name GROUPS, laddering up the tree
    members: ["Billable", "Personal Software"]    # (Billable's 3 clients + Personal)
    weekly_hours:  30
    monthly_hours: 130
